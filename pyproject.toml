[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cns-planner"
version = "0.1.0"
description = "Local CNS route planning workbench"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.51,<2"]

[project.optional-dependencies]
geo = ["rasterio>=1.4,<2", "pyproj>=3.7,<4", "shapely>=2,<3", "geopandas>=1,<2", "openpyxl>=3.1,<4", "folium>=0.19,<1", "streamlit-folium>=0.25,<1"]
dev = ["pytest>=8,<9"]
# Radar Surveillance Layout V1 的精确求解（scipy.optimize.milp + HiGHS）。
# 未安装时该模型显式返回 solver_unavailable，**绝不**退化为 greedy。
optimization = ["scipy>=1.11,<2"]

[tool.setuptools.packages.find]
include = ["cns_planner*"]

[tool.setuptools.package-data]
cns_planner = ["config/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.json", "web/js/**/*.js", "web/css/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
